# Local development database only. PostGIS is required (distance-based matching).
# The password below is a throwaway for a local container that is bound to localhost.
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: kaam
      POSTGRES_PASSWORD: kaam_local_dev_only
      POSTGRES_DB: kaam
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - kaam_pgdata:/var/lib/postgresql/data
volumes:
  kaam_pgdata:
